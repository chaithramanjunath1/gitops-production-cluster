apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/chaithramanjunath1/gitops-production-cluster.git'
    targetRevision: HEAD
    path: apps/frontend-web
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
